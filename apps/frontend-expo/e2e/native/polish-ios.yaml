appId: so.tracking.app
---
- launchApp:
    stopApp: false
- repeat:
    times: 3
    commands:
      - tapOn:
          text: Open
          optional: true
- extendedWaitUntil:
    visible: Home
    timeout: 120000
- runScript: wrapped.js
- tapOn:
    text: Plans
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: Exercise regularly
    direction: DOWN
- tapOn:
    text: Exercise regularly
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: Training roadmap
    direction: DOWN
- assertVisible: Training roadmap
- takeScreenshot: plan-notes-polish-${output.theme}
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Edit plan notes
    waitToSettleTimeoutMs: 500
- assertVisible: PREVIEW
- scrollUntilVisible:
    element: Cancel
    direction: DOWN
- tapOn:
    text: Cancel
    waitToSettleTimeoutMs: 500
- assertVisible: Training roadmap
- scrollUntilVisible:
    element: Current week
    direction: DOWN
- takeScreenshot: plan-islands-polish-${output.theme}
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Plans
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Metrics
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: Energy Insights
    direction: DOWN
- scrollUntilVisible:
    element: "Sauna reliability: Insufficient"
    direction: DOWN
- assertVisible: "Gym reliability: Confident"
- assertVisible: "Running reliability: Medium"
- assertVisible: "Chess reliability: Weak"
- takeScreenshot: metric-insights-polish-${output.theme}
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Sauna reliability: Insufficient"
    waitToSettleTimeoutMs: 500
- assertVisible: "Current Data Points: 2"
- tapOn:
    text: Close
    waitToSettleTimeoutMs: 500
- tapOn:
    text: Metrics
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Profile
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: Exercise regularly
    direction: DOWN
- takeScreenshot: profile-reveal-${output.theme}
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Profile
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Home
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: timeline-row
    direction: DOWN
- doubleTapOn: Home
- extendedWaitUntil:
    visible: Messages
    timeout: 10000
- takeScreenshot: home-reveal-${output.theme}
- waitForAnimationToEnd:
    timeout: 3000
