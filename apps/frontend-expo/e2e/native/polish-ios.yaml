appId: so.tracking.app
---
- launchApp:
    stopApp: false
- repeat:
    times: 3
    commands:
      - tapOn:
          text: Open
          optional: true
- extendedWaitUntil:
    visible: Home
    timeout: 120000
- runScript: wrapped.js
- tapOn:
    text: Plans
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: Exercise regularly
    direction: DOWN
- tapOn:
    text: Exercise regularly
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: Current week
    direction: DOWN
- takeScreenshot: plan-islands-polish-${output.theme}
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Plans
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Metrics
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: ".*Sauna: 3 more days, signal 0 of 3"
    direction: DOWN
- assertVisible: "Your energy tends to be higher on Chess days and lower on Gym days."
- assertVisible: ".*Gym: −23%, signal 3 of 3"
- assertVisible: ".*Running: \\+3%, signal 2 of 3"
- assertVisible: ".*Chess: \\+21%, signal 1 of 3"
- takeScreenshot: metric-insights-polish-${output.theme}
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: ".*Sauna: 3 more days, signal 0 of 3"
    waitToSettleTimeoutMs: 500
- assertVisible: "2 Sauna days with a check-in so far."
- tapOn:
    text: "Close .*Sauna"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: Metrics
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Profile
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: Exercise regularly
    direction: DOWN
- takeScreenshot: profile-reveal-${output.theme}
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Profile
    waitToSettleTimeoutMs: 500
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: Home
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element:
      id: timeline-row
    direction: DOWN
- doubleTapOn: Home
- extendedWaitUntil:
    visible: Messages
    timeout: 10000
- takeScreenshot: home-reveal-${output.theme}
- waitForAnimationToEnd:
    timeout: 3000
