appId: so.tracking.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: Home
    timeout: 120000
- openLink: trackingso://health-workout/health-run
- extendedWaitUntil:
    visible: Workout details
    timeout: 20000
- assertVisible: Your Apple Watch vitals
- assertVisible: Elevation profile
- assertVisible: "151 bpm"
- assertVisible: "5.10 km"
- takeScreenshot: workout-vitals-overview
- scrollUntilVisible:
    element: Heart rate
    direction: DOWN
    centerElement: true
- takeScreenshot: workout-vitals-heart-rate
- scrollUntilVisible:
    element: Map
    direction: DOWN
    centerElement: true
- takeScreenshot: workout-vitals-map
- scrollUntilVisible:
    element: Heart-rate zones
    direction: DOWN
    centerElement: true
- takeScreenshot: workout-vitals-zones
- assertVisible: Heart-rate zones
- scrollUntilVisible:
    element:
      id: workout-privacy-card
    direction: DOWN
    centerElement: true
- assertVisible:
    id: workout-privacy-card
- takeScreenshot: workout-vitals-details
- swipe:
    start: 50%, 82%
    end: 50%, 28%
    duration: 500
- swipe:
    start: 50%, 82%
    end: 50%, 28%
    duration: 500
- swipe:
    start: 50%, 82%
    end: 50%, 28%
    duration: 500
- assertVisible: Create share card
- tapOn: Create share card
- extendedWaitUntil:
    visible: Preview
    timeout: 10000
- scrollUntilVisible:
    element: "6 stats"
    direction: DOWN
    centerElement: true
- tapOn: "6 stats"
- scrollUntilVisible:
    element: Landscape
    direction: DOWN
    centerElement: true
- tapOn: Landscape
- assertVisible: Distance
- assertVisible: Time
- assertVisible: Pace
- assertVisible: Elevation
- assertVisible: Avg heart rate
- assertVisible: Calories
- assertVisible: tracking.so
- takeScreenshot: workout-share-landscape
- scrollUntilVisible:
    element:
      id: share-export-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: share-export-button
- extendedWaitUntil:
    visible: Save Image
    timeout: 10000
- takeScreenshot: workout-share-export-sheet
