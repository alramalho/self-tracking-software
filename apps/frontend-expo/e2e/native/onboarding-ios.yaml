appId: so.tracking.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: Home
    timeout: 120000
- tapOn: Profile
- scrollUntilVisible:
    element: Settings
    direction: UP
- tapOn: Settings
- tapOn: Color Palette
- assertVisible: Random
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: settings-colors
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: Back to Settings
- tapOn: Theme Mode
- assertVisible: Auto
- takeScreenshot: settings-theme
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: Back to Settings
- tapOn: Integrations & API Keys
- takeScreenshot: settings-integrations
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: API keys
- assertVisible: 1. Create an API key
- tapOn: Back to Integrations
- tapOn: Apple Health
- assertVisible: Workouts and sleep, together
- tapOn: Back to Integrations
- tapOn: Back to Settings
- tapOn: User Settings
- takeScreenshot: settings-profile
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: Full Name
- tapOn:
    id: editor-Full Name
- eraseText
- inputText: Uncommitted name
- takeScreenshot: settings-profile-keyboard
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: Done editing input
- tapOn: Cancel
- tapOn: Back to Settings
- scrollUntilVisible:
    element: Preview onboarding
    direction: DOWN
- tapOn: Preview onboarding
- tapOn: Start preview
- assertVisible: Welcome to tracking.so
- takeScreenshot: onboarding-welcome
- tapOn: Let's start
- assertVisible: What's your goal\?
- assertVisible: Dictate answer
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: onboarding-start
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: onboarding-answer
- inputText: I want to write guitar songs to express myself
- takeScreenshot: onboarding-keyboard
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: ^Continue$
- assertVisible: Where are you now\?
- takeScreenshot: onboarding-starting-point
- tapOn: Skip this question
- assertVisible: Why does it matter\?
- takeScreenshot: onboarding-why
- tapOn: Skip this question
- assertVisible: How many times a week\?
- assertVisible:
    id: onboarding-weekly-frequency-value
- tapOn:
    id: onboarding-frequency-increase
- assertVisible: 4 sessions per week
- tapOn:
    id: onboarding-frequency-decrease
- assertVisible: 3 sessions per week
- takeScreenshot: onboarding-week
- tapOn: ^Continue$
- assertVisible:
    id: coach-tour-role
- tapOn: ^Continue$
- assertVisible:
    id: coach-tour-contact
- tapOn: ^Continue$
- assertVisible:
    id: coach-tour-data
- tapOn: ^Continue$
- assertVisible: Do it with a group\?
- takeScreenshot: onboarding-circle
- tapOn: Find me a circle
- assertVisible: Match me by
- takeScreenshot: onboarding-match-by
- tapOn: ^Continue$
- assertVisible:
    id: onboarding-plan-summary
- takeScreenshot: onboarding-plan
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: This feels right
- takeScreenshot: onboarding-paywall
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: Preview coaching unlock
- assertVisible: Your preview is complete
