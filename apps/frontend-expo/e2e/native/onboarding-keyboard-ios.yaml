appId: so.tracking.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: Home
    timeout: 120000
- tapOn: Profile
- scrollUntilVisible:
    element: Settings
    direction: UP
- tapOn: Settings
- scrollUntilVisible:
    element: Preview onboarding
    direction: DOWN
- tapOn: Preview onboarding
- tapOn: Start preview
- tapOn: "I'm ready!"
- assertVisible: What is your age?
- tapOn: Increase age
- takeScreenshot: onboarding-welcome-age
- tapOn: Continue
- assertVisible: Dictate answer
- tapOn:
    id: onboarding-answer
- inputText: I want to write guitar songs for my family.
- tapOn: Dictate answer
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible: Stop dictation.*
    timeout: 10000
- takeScreenshot: onboarding-dictation-recording
- tapOn: Stop dictation.*
- extendedWaitUntil:
    visible: .*I will practise three times a week.*
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: onboarding-keyboard-fixed
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: What's your goal\?
- tapOn: ^Continue$
- assertVisible: Where are you now\?
- tapOn: Skip this question
- assertVisible: Why does it matter\?
- tapOn: Skip this question
- assertVisible: How many times a week\?
